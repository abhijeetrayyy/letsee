name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job, because all three checks are deterministic and fast — no network,
  # no database, no secrets. Splitting them cost a second `npm ci` for no
  # signal that the step names do not already give.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking as of this commit. It was not, briefly, and deliberately:
      # restoring the linter surfaced 33 errors that had accumulated while
      # `next lint` was silently broken, and a red build on day one teaches
      # people to ignore the badge — which is roughly how a dead linter goes
      # unnoticed for a year. The backlog is cleared, so the gate closes.
      #
      # This fails on errors, not warnings. 73 warnings remain (62
      # no-img-element, 11 exhaustive-deps); both are real work rather than lint
      # noise, and neither should hold up an unrelated pull request. To stop
      # that number growing, add `--max-warnings=73` to the lint script — a
      # ratchet, not a deadline.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

# The production build is deliberately absent. Vercel builds every push with the
# real environment, which is a stricter gate than this workflow could be with
# placeholder secrets — and a build that needs fake credentials to pass proves
# less than the one that ships.
